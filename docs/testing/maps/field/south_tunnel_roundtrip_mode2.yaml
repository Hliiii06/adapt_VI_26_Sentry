# Real PCD south tunnel: enter -> uphill -> plateau -> downhill -> exit.
# Initial body position (1.6, -6.0, 0.07).
# Diagnostic cylinder: radius 0.26 m, total height 0.10 m ONLY.
# z values are body-centre heights (selected ground + 0.05), not ground heights.
# Keep the south_tunnel support grid enabled; this is not a grid-free experiment.
# FSM may advance an intermediate waypoint within 0.5 m; these are guide points,
# not exact stopping locations. The return traverses the same corridor backwards.
/sentry_sim/scan_planner_node:
  ros__parameters:
    fsm.navi_mode: 2
    fsm.waypoints:
      [-1.50, -6.00, 0.270,
        1.60, -6.00, 0.070]
